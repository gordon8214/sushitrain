name: "Build iOS+macOS app"

on:
  pull_request:
  push:

env:
  GO_VERSION: "~1.27.0"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    # and https://github.com/actions/runner-images#available-images
    runs-on: xcode-27
    steps:
      - name: Check Xcode version
        run: |
          /usr/bin/xcodebuild -version
          sudo /usr/bin/xcode-select -switch /Applications/Xcode_27.0.app
          xcrun simctl list > /dev/null
          /usr/bin/xcodebuild -version

      - name: Install iOS platform
        run: |
          xcodebuild -downloadPlatform iOS

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Lint
        run: |
          make lint

      - name: Test packages
        run: |
          make test

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: true

      - name: Build core
        run: |
          make core

      - name: Build for iOS and macOS
        run: |
          make build

      - name: Package application
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --keepParent Build "dist/sushitrain-${{ github.sha }}.zip"
          shasum -a 256 "dist/sushitrain-${{ github.sha }}.zip"

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/sushitrain-${{ github.sha }}.zip

      - name: Attach build to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: dist/sushitrain-${{ github.sha }}.zip
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$RELEASE_ASSET" --clobber
          else
            gh release create "${{ github.ref_name }}" "$RELEASE_ASSET" \
              --draft \
              --title "${{ github.ref_name }}" \
              --notes "Automated build for ${{ github.ref_name }}"
          fi

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/sushitrain-${{ github.sha }}.zip
          retention-days: 3

  mac-release:
    name: Sign and notarize the Mac app
    # Tags only, in an environment of its own: this repository is public, and the Developer ID certificate and the
    # notary key must stay out of branch and pull request builds. See Docs/macos.md for the secrets.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: xcode-27
    environment: mac-release
    steps:
      - name: Check Xcode version
        run: |
          sudo /usr/bin/xcode-select -switch /Applications/Xcode_27.0.app
          xcrun simctl list > /dev/null
          /usr/bin/xcodebuild -version

      # The Go framework has slices for iOS as well
      - name: Install iOS platform
        run: |
          xcodebuild -downloadPlatform iOS

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: true

      - name: Install signing credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          make mac-release

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: Build/release/*.dmg

      # The build job has created the draft release by now
      - name: Attach disk image to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" Build/release/*.dmg --clobber
